# Limine configuration for maeros-limine.iso (make limine-iso).
# Limine boots the 32-bit kernel through Multiboot 2 from legacy BIOS and from
# UEFI firmware (x86_64 via BOOTX64.EFI, IA32 via BOOTIA32.EFI) alike.  The
# kernel's MB2 header asks for a 32-bpp framebuffer (VBE or GOP); `resolution`
# overrides the size, and Limine falls back to another mode if the firmware
# lacks it.  Syntax: third_party/limine (CONFIG.md of the pinned release).
timeout: 1
serial: yes

/MaeroOS
    protocol: multiboot2
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initrd.tar
    module_string: initrd
    resolution: 1920x1080x32
