<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  MaeroOS has no conf.d: this file is the whole fontconfig configuration.
  /usr/share/fonts (initrd) carries DejaVu Sans alone for the GTK probes;
  /disk/firefox/share/fonts is the full DejaVu set that
  ports/firefox/fetch-runtime.sh installs on disk-ff (Sans, Serif, Sans Mono,
  each in regular, bold, italic and bold italic).  Where a face exists twice
  fontconfig keeps the higher font version.

  The aliases give every CSS generic and the common named families a real
  face: without them fontconfig matches everything to the nearest font it
  has, and serif, monospace, Times or Courier all come out as DejaVu Sans.
  "prefer" puts DejaVu ahead of the requested name, then fontconfig's
  ordinary coverage-based sort is the fallback for characters DejaVu lacks
  (Firefox's own fonts/TwemojiMozilla.ttf for emoji).
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/disk/usr/share/fonts</dir>
  <dir>/disk/firefox/share/fonts</dir>
  <cachedir>/tmp/fontcache</cachedir>

  <!-- Legacy GTK/Pango names ("Sans 10" in ffcfg/gtk-3.0/settings.ini). -->
  <alias binding="same"><family>Sans</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Serif</family><accept><family>serif</family></accept></alias>
  <alias binding="same"><family>Monospace</family><accept><family>monospace</family></accept></alias>
  <alias binding="same"><family>mono</family><accept><family>monospace</family></accept></alias>
  <alias binding="same"><family>system-ui</family><accept><family>sans-serif</family></accept></alias>

  <!-- Named families pages ask for, by the generic they stand in for. -->
  <alias binding="same"><family>Arial</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Verdana</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Open Sans</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Roboto</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Times</family><accept><family>serif</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>serif</family></accept></alias>
  <alias binding="same"><family>Georgia</family><accept><family>serif</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>monospace</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>monospace</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>monospace</family></accept></alias>
  <alias binding="same"><family>Menlo</family><accept><family>monospace</family></accept></alias>

  <!-- A family nobody named falls back to sans-serif (fontconfig's own
       49-sansserif.conf rule, which this minimal config would otherwise lack). -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>

  <!-- The generics themselves. -->
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
