<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/disk/usr/share/fonts</dir>
  <cachedir>/tmp/fontcache</cachedir>
  <match target="pattern"><test name="family"><string>Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit></match>
</fontconfig>
