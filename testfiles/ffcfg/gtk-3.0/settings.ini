[Settings]
gtk-icon-theme-name=hicolor
gtk-fallback-icon-theme=hicolor
gtk-theme-name=Default
gtk-font-name=Sans 10
# No window-control buttons in GTK header bars.  gtkheaderbar.c only loads the
# window-minimize/maximize/close-symbolic icons (which fail to decode from
# libgtk's gresource here → NULL pixbuf → crash) for buttons named in this
# layout.  An empty layout (":") means no buttons on either side, so those
# icons are never loaded and the crash can't happen (maeroX draws the titlebar).
gtk-decoration-layout=:
