// MaeroOS autoconfig (ports/firefox/autoconfig, docs/sandbox.md).
// Eight seconds after start, once a content process is up, print the
// "Sandbox" section of about:support with dump() (ff points stdout at the
// serial console), one line starting "maeros-sandbox: ", so a smoke run
// records the sandbox features Firefox found and the content sandbox level
// it uses.  The fields are gathered the way Troubleshoot.sys.mjs gathers
// them for about:support (its full snapshot also probes graphics, which is
// slow here and not needed).
pref("browser.dom.window.dump.enabled", true);
function maerosSandboxReport() {
  const data = {};
  for (const key of ["hasSeccompBPF", "hasSeccompTSync", "hasPrivilegedUserNamespaces",
                     "hasUserNamespaces", "canSandboxContent", "canSandboxMedia"]) {
    if (Services.sysinfo.hasKey(key))
      data[key] = Services.sysinfo.getPropertyAsBool(key);
  }
  try {
    const reporter = Cc["@mozilla.org/sandbox/syscall-reporter;1"]
                       .getService(Ci.mozISandboxReporter);
    const snapshot = reporter.snapshot();
    const log = [];
    for (let i = snapshot.begin; i < snapshot.end; ++i) {
      const r = snapshot.getElement(i);
      log.push({ procType: r.procType, pid: r.pid, tid: r.tid, syscall: r.syscall });
    }
    data.syscallLog = log;
  } catch (e) {
    data.syscallLogError = String(e);
  }
  const settings = Cc["@mozilla.org/sandbox/sandbox-settings;1"]
                     .getService(Ci.mozISandboxSettings);
  data.contentSandboxLevel = Services.prefs.getIntPref("security.sandbox.content.level");
  data.effectiveContentSandboxLevel = settings.effectiveContentSandboxLevel;
  return data;
}
// Firefox's own startup timeline (Services.startup.getStartupInfo(), what
// about:telemetry shows as simpleMeasurements), as ms since the process
// started, one line "maeros-startup: {...}" once firstPaint is recorded.
function maerosStartupReport() {
  const info = Services.startup.getStartupInfo();
  if (!info.process || !info.firstPaint)
    return null;
  const t0 = info.process.getTime(), out = {};
  for (const k of Object.keys(info)) {
    if (info[k] && typeof info[k].getTime === "function")
      out[k] = info[k].getTime() - t0;
  }
  return out;
}
try {
  dump("maeros-cfg: loaded\n");
  const { setTimeout } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
  setTimeout(function () {
    try {
      dump("maeros-sandbox: " + JSON.stringify(maerosSandboxReport()) + "\n");
    } catch (e) {
      dump("maeros-sandbox-error: " + e + "\n");
    }
  }, 8000);
  let tries = 0;
  const startupTimer = function () {
    try {
      const r = maerosStartupReport();
      if (r)
        dump("maeros-startup: " + JSON.stringify(r) + "\n");
      else if (++tries < 120)
        setTimeout(startupTimer, 500);
    } catch (e) {
      dump("maeros-startup-error: " + e + "\n");
    }
  };
  setTimeout(startupTimer, 1000);
} catch (e) {
  dump("maeros-sandbox-error: " + e + "\n");
}
